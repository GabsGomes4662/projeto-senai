<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - GamePro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #121214;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container-login {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #1e1e26;
            color: #fff;
            border: none;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .form-control {
            background: #2a2a35;
            border: 1px solid #3a3a48;
            color: #fff;
        }
        .form-control:focus {
            background: #2a2a35;
            border-color: var(--azul);
            color: #fff;
            box-shadow: none;
        }


    </style>
</head>
<body>

<!-- CABEÇALHO -->
<header class="cabecalho">
    <div class="container">
        <div class="row align-items-center justify-content-around">
            <div class="col-auto">
                <a href="#" class="logo">
                    <i class="fas fa-gamepad"></i>
                    <span>GamePro</span>
                </a>
               
            </div>

            <!-- BOTÃO MENU HAMBÚRGUER (só aparece em telas pequenas) -->
            <div class="col-auto d-md-none">
                <button class="btn btn-dark border-0 p-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral" aria-controls="menuLateral">
                    <i class="fas fa-bars fs-5"></i>
                </button>
            </div>

            <!-- MENU NORMAL (só aparece em telas grandes) -->
            <div class="col-auto d-none d-md-flex menu-navegacao">
                <a href="#">Início</a>
                <a href="#">Produtos</a>
                <a href="#">Categorias</a>
                <a href="#">Promoções</a>
                <a href="#">Suporte</a>
                <a href="/login.html"><i class="fas fa-user-circle fs-5 ps-2"></i></a>
            </div>

                  
</header>

<div class="container-login">
    <div class="card px-4 py-2 mt-5">
        <h3 class="text-center mb-4 mt-3"><i class="fas fa-gamepad me-2"></i> Acesso</h3>
        <div id="alerta" class="alert d-none"></div>

        <form id="formLogin">
            <div class="mb-3">
                <label>Usuário</label>
                <input type="text" class="form-control" id="usuario" required>
            </div>
            <div class="mb-3">
                <label>Senha</label>
                <input type="password" class="form-control" id="senha" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
            <p class="text-center mt-3">Não tem conta? <a href="#" id="mostrarCadastro">Cadastre-se</a></p>
            <p class="text-center small text-white">Usuário teste: <strong>admin</strong> | Senha: <strong>123456</strong></p>
        </form>

        <form id="formCadastro" class="d-none">
            <div class="mb-3">
                <label>Nome Completo</label>
                <input type="text" class="form-control" id="nomeCad" required>
            </div>
            <div class="mb-3">
                <label>E-mail</label>
                <input type="email" class="form-control" id="emailCad" required>
            </div>
            <div class="mb-3">
                <label>Usuário</label>
                <input type="text" class="form-control" id="usuarioCad" required>
            </div>
            <div class="mb-3">
                <label>Senha (mínimo 6 caracteres)</label>
                <input type="password" class="form-control" id="senhaCad" minlength="6" required>
            </div>
            <div class="mb-3">
                <label>Confirmar Senha</label>
                <input type="password" class="form-control" id="confirmaSenha" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Cadastrar</button>
            <p class="text-center mt-3">Já tem conta? <a href="#" id="mostrarLogin">Fazer login</a></p>
        </form>
    </div>
</div>

<footer class="rodape text-white bg-dark">
    <div class="container">
        <p>© 2026 GamePro - Todos os direitos Reservados</p>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function() {
    $('#mostrarCadastro').click(e => {
        e.preventDefault();
        $('#formLogin').addClass('d-none');
        $('#formCadastro').removeClass('d-none');
        $('#alerta').addClass('d-none');
    });

    $('#mostrarLogin').click(e => {
        e.preventDefault();
        $('#formCadastro').addClass('d-none');
        $('#formLogin').removeClass('d-none');
        $('#alerta').addClass('d-none');
    });

    function mensagem(texto, tipo) {
        $('#alerta').removeClass('d-none alert-success alert-danger').addClass(`alert-${tipo}`).text(texto);
    }

    const usuarioPadrao = { usuario: 'admin', senha: '123456', nome: 'Administrador' };

    $('#formLogin').submit(function(e) {
        e.preventDefault();
        const user = $('#usuario').val().trim();
        const pass = $('#senha').val().trim();

        if (user === usuarioPadrao.usuario && pass === usuarioPadrao.senha) {
            sessionStorage.setItem('logado', JSON.stringify(usuarioPadrao));
            mensagem('Login realizado com sucesso!', 'success');
            setTimeout(() => window.location.href = 'index.html', 1000);
            return;
        }

        const lista = JSON.parse(localStorage.getItem('usuarios')) || [];
        const encontrado = lista.find(u => u.usuario === user && u.senha === pass);

        if (encontrado) {
            sessionStorage.setItem('logado', JSON.stringify(encontrado));
            mensagem('Login realizado com sucesso!', 'success');
            setTimeout(() => window.location.href = 'index.html', 1000);
        } else {
            mensagem('Usuário ou senha incorretos!', 'danger');
        }
    });

    $('#formCadastro').submit(function(e) {
        e.preventDefault();
        const nome = $('#nomeCad').val().trim();
        const email = $('#emailCad').val().trim();
        const user = $('#usuarioCad').val().trim();
        const pass = $('#senhaCad').val().trim();
        const confirma = $('#confirmaSenha').val().trim();

        if (pass !== confirma) return mensagem('As senhas não coincidem!', 'danger');

        const lista = JSON.parse(localStorage.getItem('usuarios')) || [];
        const existe = lista.some(u => u.usuario === user || u.email === email);
        if (existe) return mensagem('Usuário ou e-mail já cadastrado!', 'danger');

        const novo = { nome, email, usuario: user, senha: pass };
        lista.push(novo);
        localStorage.setItem('usuarios', JSON.stringify(lista));
        sessionStorage.setItem('logado', JSON.stringify(novo));

        mensagem('Cadastro realizado com sucesso!', 'success');
        setTimeout(() => window.location.href = 'index.html?cadastro=ok', 1200);
    });
});
</script>

</body>
</html>
